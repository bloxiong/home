# Render's free plan puts the API to sleep after 15 minutes without traffic,
# which makes the next survey or contact submission wait ~50 seconds.
# This pings it every 10 minutes so it stays awake.
# Note: GitHub pauses scheduled workflows after 60 days with no commits;
# re-enable it under the Actions tab if that happens.
name: Keep API awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping the API health check
        run: |
          for i in 1 2 3; do
            if curl -fsS --max-time 60 https://api.bloxio.tech/health; then exit 0; fi
            sleep 15
          done
          echo "API did not answer" && exit 1
